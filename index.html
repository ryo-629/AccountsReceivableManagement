<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>未収管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="index-page" class="page active">
    <header>
        <h1>顧客リスト</h1>
    </header>
    <div class="container">
        <div class="input-group">
            <input type="text" id="new-customer-name" placeholder="新しい顧客名を入力">
            <button onclick="addCustomer()">顧客を追加</button>
        </div>
        <div id="customer-list"></div>
    </div>
</div>

<div id="detail-page" class="page">
    <header>
        <h1 id="detail-title">顧客詳細</h1>
        <div class="summary-box">
            <div>総売上累計: <span id="total-sale">¥0</span></div>
            <div>回収済み累計: <span id="total-collect">¥0</span></div>
            <div class="balance">現在の未収残高: <span id="total-balance">¥0</span></div>
        </div>
    </header>
    <div class="container">
        <a href="#" class="back-link" onclick="showIndex()">← 顧客リストへ戻る</a>
        
        <div class="input-group">
            <label>表示月を選択</label>
            <input type="month" id="view-month" onchange="renderMishuList()">
            <hr>
            <label>日付</label>
            <input type="date" id="mishu-date">
            <label>種別</label>
            <select id="mishu-type">
                <option value="sale">未収</option>
                <option value="collect">回収</option>
            </select>
            <label>金額</label>
            <input type="number" id="mishu-amount" placeholder="金額を入力">
            <button onclick="addMishuData()">データを登録</button>
        </div>

        <div class="tab-menu">
            <button id="tab-sale" class="tab-btn active" onclick="switchTab('sale')">未収リスト</button>
            <button id="tab-collect" class="tab-btn" onclick="switchTab('collect')">回収済みリスト</button>
        </div>

        <table class="mishu-table">
            <thead>
                <tr>
                    <th style="width: 50px;">状況</th>
                    <th>日付</th>
                    <th>金額</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="mishu-table-body"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
